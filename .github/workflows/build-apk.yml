name: Build APK + PC package
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx --yes @capacitor/assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PCPhone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: scripts/pack-pc.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: PCPhone-for-Windows
          path: PCPhone
          include-hidden-files: true
  release:
    needs: [apk, pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - run: |
          cd out/PCPhone-for-Windows && zip -qr ../../PCPhone-for-Windows.zip . && cd ../..
          cp out/PCPhone-apk/app-debug.apk PCPhone.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true
          gh release create latest PCPhone.apk PCPhone-for-Windows.zip --repo ${{ github.repository }} --title "PC Phone (latest)" --notes "APK for your phone + Windows PC package" --latest
